name = "bbb-refresh"
main = "src/index.js"
compatibility_date = "2026-01-01"

routes = [
  { pattern = "bestballbutts.rrr-projects.com", custom_domain = true },
  { pattern = "bbb-refresh.rrr-projects.com", custom_domain = true }   # legacy hostname, keeps serving
]

# The page itself (built by scripts/build.py into worker/public/)
[assets]
directory = "./public"
binding = "ASSETS"

# The live "database": computed seasons + snapshot the page reads
[[kv_namespaces]]
binding = "DATA"
id = "163b167b2bfc439dbc53c3a643208cf3"

# Self-refresh from Sleeper once a night at 9 PM Eastern (01:00 UTC in EDT, 02:00 UTC in EST;
# the Worker skips whichever slot is not 9 PM ET). The Refresh button works any time.
[triggers]
crons = ["0 1,2 * * *"]
