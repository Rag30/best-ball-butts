name: Deploy Worker

# Deploys bestballbutts.rrr-projects.com whenever the page or Worker code on
# main changes, the same way AI-Tools' deploy-workers.yml deploys the launcher.
# Tests run first; the deploy runs only if they pass.
#
# The one secret is CLOUDFLARE_API_TOKEN: the `wrangler-rrr-projects` token
# held in Doppler automationtokens/prd as CLOUDFLARE_WRANGLER_TOKEN. It is a
# secret of the GitHub environment `cloudflare`, whose deployment branches are
# limited to main, so only a run from main can read it.
#
# The nightly archive job (update.yml) commits data/ with GITHUB_TOKEN, which
# never starts another workflow, and data/ is not in the paths below anyway:
# the live site reads its data from KV, not from the deploy.

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "scripts/build.py"
      - "scripts/compute.js"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: a27c00ccec1ac3a3ed3e8934fdacd57b

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Worker tests
        working-directory: worker
        run: npm test
      - name: Build the page and smoke-test it
        run: |
          python3 scripts/build.py
          node scripts/smoke.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the page
        run: python3 scripts/build.py
      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing secret CLOUDFLARE_API_TOKEN in the 'cloudflare' environment" >&2
            exit 1
          fi
          npx --yes wrangler@4 deploy
