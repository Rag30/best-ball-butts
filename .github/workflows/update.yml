name: Update league data

on:
  schedule:
    # Fires every 5 min Sept-Jan; scripts/gate.py decides whether this slot actually runs:
    #   game day -> every 5 min | other days -> hourly | Tue/Fri 09:00 ET -> also commit archive
    - cron: "*/5 * * 9-12,1 *"
  workflow_dispatch:
    inputs:
      refetch_all:
        description: "Ignore freeze rules and re-fetch every week"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Decide what this run does (NFL schedule gate)
        id: gate
        run: python scripts/gate.py

      - name: Fetch from Sleeper
        if: steps.gate.outputs.run == 'true'
        run: python scripts/fetch.py ${{ inputs.refetch_all && '--all' || '' }}

      - name: Recompute + build site
        if: steps.gate.outputs.run == 'true'
        run: |
          node scripts/compute-node.js
          python scripts/build.py
          node scripts/smoke.js

      - name: Upload site
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        if: steps.gate.outputs.run == 'true'
        uses: actions/deploy-pages@v4

      - name: Commit archive (Tue/Fri or manual)
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.archive == 'true'
        run: |
          git config user.name "league-bot"
          git config user.email "league-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            changed=$(python -c "import json;print(', '.join(json.load(open('data/raw/last_fetch.json'))['changed']) or 'derived only')")
            git commit -m "Archive: ${changed}"
            git push
          fi
