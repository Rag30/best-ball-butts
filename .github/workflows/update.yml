name: Update league data

on:
  schedule:
    # Tuesday 13:00 UTC (after MNF settles) and Friday 13:00 UTC (after stat corrections), Sept-Jan
    - cron: "0 13 * 9-12,1 2,5"
  workflow_dispatch:
    inputs:
      refetch_all:
        description: "Ignore freeze rules and re-fetch every week"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch new / corrected weeks from Sleeper
        run: python scripts/fetch.py ${{ inputs.refetch_all && '--all' || '' }}

      - name: Recompute derived tables
        run: python scripts/compute.py

      - name: Build site
        run: python scripts/build.py

      - name: Commit changes
        run: |
          git config user.name "league-bot"
          git config user.email "league-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            changed=$(python -c "import json;print(', '.join(json.load(open('data/raw/last_fetch.json'))['changed']) or 'derived only')")
            git commit -m "Weekly update: ${changed}"
            git push
          fi
