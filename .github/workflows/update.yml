name: Archive league data

# The live site (bestballbutts.rrr-projects.com) refreshes itself from Sleeper into Cloudflare KV.
# This job only keeps the git archive of raw Sleeper responses current.

on:
  schedule:
    # Nightly at 10 PM Eastern. GitHub cron is UTC-only, so fire at 02:00 and 03:00 UTC
    # (10 PM EDT / EST) and let the gate step skip whichever slot isn't 10 PM ET.
    - cron: "0 2,3 * * *"
  workflow_dispatch:
    inputs:
      refetch_all:
        description: "Ignore freeze rules and re-fetch every week"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Is it 10 PM Eastern? (manual runs always proceed)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          python - >> "$GITHUB_OUTPUT" << 'EOF'
          from datetime import datetime; from zoneinfo import ZoneInfo
          print("run=" + str(datetime.now(ZoneInfo("America/New_York")).hour == 22).lower())
          EOF

      - name: Fetch new / corrected weeks from Sleeper
        if: steps.gate.outputs.run == 'true'
        run: python scripts/fetch.py ${{ inputs.refetch_all && '--all' || '' }}

      - name: Recompute derived tables (reference copy)
        if: steps.gate.outputs.run == 'true'
        run: node scripts/compute-node.js

      - name: Commit
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "league-bot"
          git config user.email "league-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            changed=$(python -c "import json;print(', '.join(json.load(open('data/raw/last_fetch.json'))['changed']) or 'derived only')")
            git commit -m "Archive: ${changed}"
            git pull --rebase origin main
            git push
          fi
